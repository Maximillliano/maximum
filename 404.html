<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Страница не найдена | Maximum Studio</title><meta name="robots" content="noindex">
<style>html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Raleway,Arial,sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(60vw 60vw at 15% 0,#2a1f6b55,transparent)}
h1{font-size:clamp(80px,22vw,240px);font-weight:500;margin:0;line-height:1;letter-spacing:-.05em}p{font-size:20px;margin:12px 0 32px}
a{display:inline-block;background:#ffda66;color:#000;text-decoration:none;border-radius:30px;padding:10px 28px;font-size:20px}a:hover{background:#fff}</style></head>
<body><div><h1>404</h1><p id="t">Такой страницы нет. Вернитесь на главную.</p><a id="h" href="/">На главную</a></div>
<script>/* если сайт открыт как username.github.io/repo/ — ведём в папку репозитория */
var s=location.pathname.split('/')[1];if(/github\.io$/.test(location.hostname)&&s&&!/\.html?$/.test(s)&&s!==''){document.getElementById('h').href='/'+s+'/'}
if((navigator.language||'').slice(0,2)!=='ru'){document.documentElement.lang='en';document.getElementById('t').textContent='This page does not exist. Go back to the homepage.';document.getElementById('h').textContent='Home'}</script></body></html>
